[project]
name = "htmlshot"
version = "0.1.0"
description = "FastAPI service for preparing HTML templates for image rendering."
readme = "README.md"
authors = [
    { name = "KubikNoLego", email = "originallikitun@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "kubiks>=0.1.3",
    "loguru>=0.7.3",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
htmlshot = "htmlshot.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

